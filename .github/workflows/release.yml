name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src

      - name: Build wheel
        run: |
          rm -rf build src/jons_mcp_java.egg-info dist
          uv build --wheel --out-dir dist

      - name: Verify wheel version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile
          from email.parser import Parser

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              print(f"Expected exactly one wheel, found {len(wheels)}: {wheels}", file=sys.stderr)
              sys.exit(1)

          tag = __import__("os").environ["RELEASE_TAG"]
          expected = tag[1:] if tag.startswith("v") else tag

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_name = next(
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = Parser().parsestr(archive.read(metadata_name).decode("utf-8"))

          actual = metadata["Version"]
          if actual != expected:
              print(
                  f"Wheel version {actual!r} does not match release tag {tag!r} "
                  f"(expected {expected!r})",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-wheel
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  upload-release-asset:
    name: Upload wheel to GitHub Release
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist

      - name: Upload wheel to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl --clobber --repo "$GH_REPO"
